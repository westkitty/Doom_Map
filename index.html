<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#06090d" />
    <meta name="description" content="Doom Map — an interactive global disaster and consequence simulator." />
    <title>Doom Map</title>
  </head>
  <body>
    <main id="app" aria-label="Doom Map globe">
      <canvas id="globe" aria-label="Interactive three-dimensional Earth"></canvas>
      <section class="hud" aria-live="polite">
        <div>
          <p class="eyebrow">DOOM MAP / FOUNDATION</p>
          <h1>Earth is the interface.</h1>
          <p id="status">Three.js globe foundation · model systems pending</p>
        </div>
        <div class="telemetry" aria-label="Globe telemetry">
          <span id="lat">LAT 0.000°</span>
          <span id="lon">LON 0.000°</span>
          <span id="alt">ALT —</span>
        </div>
      </section>
      <aside class="source-note">
        <strong>FOUNDATION BUILD</strong>
        <span>No disaster model is active. Scientific outputs are not yet implemented.</span>
      </aside>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
